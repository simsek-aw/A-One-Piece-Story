# Render.com — kostenloses Web-Deployment (Blueprint).
# Anleitung: docs/DEPLOY.md. Kurz: Repo auf render.com verbinden -> "New +" ->
# "Blueprint" -> dieses Repo wählen. Render liest diese Datei und richtet alles ein.
services:
  - type: web
    name: a-one-piece-story
    runtime: node
    plan: free            # kostenlos (schläft nach ~15 Min Inaktivität ein)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/meta
    autoDeploy: true       # bei jedem Push auf den verbundenen Branch neu deployen
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Standard ist der Mock-Spielleiter (kein Schlüssel nötig).
      #
      # Empfehlung, wenn kein OpenAI-Guthaben vorhanden ist: Google Gemini hat
      # einen kostenlosen Kontingent-Tarif (im Render-Dashboard setzen):
      # - key: AI_PROVIDER
      #   value: gemini
      # - key: GEMINI_API_KEY
      #   sync: false        # als Secret im Dashboard eintragen, NICHT hier
      # - key: GEMINI_MODEL
      #   value: gemini-2.0-flash # optional
      #
      # Alternativ über OpenAI:
      # - key: AI_PROVIDER
      #   value: openai
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: OPENAI_MODEL
      #   value: gpt-4o-mini # optional; z. B. gpt-4o für mehr Qualität
      #
      # Alternativ über Anthropic/Claude:
      # - key: AI_PROVIDER
      #   value: anthropic
      # - key: ANTHROPIC_API_KEY
      #   sync: false
