# Render.com — kostenloses Web-Deployment (Blueprint).
# Anleitung: docs/DEPLOY.md. Kurz: Repo auf render.com verbinden -> "New +" ->
# "Blueprint" -> dieses Repo wählen. Render liest diese Datei und richtet alles ein.
services:
  - type: web
    name: a-one-piece-story
    runtime: node
    plan: free            # kostenlos (schläft nach ~15 Min Inaktivität ein)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/meta
    autoDeploy: true       # bei jedem Push auf den verbundenen Branch neu deployen
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Standard ist der Mock-Spielleiter (kein Schlüssel nötig).
      #
      # Empfehlung, wenn kein OpenAI-Guthaben vorhanden ist: Google Gemini hat
      # einen kostenlosen Kontingent-Tarif (im Render-Dashboard setzen):
      # - key: AI_PROVIDER
      #   value: gemini
      # - key: GEMINI_API_KEY
      #   sync: false        # als Secret im Dashboard eintragen, NICHT hier
      # - key: GEMINI_MODEL
      #   value: gemini-2.5-flash # optional
      #
      # Alternativ über OpenRouter (EIN Key, viele Modelle — auch kostenlose
      # mit ":free"-Endung, siehe https://openrouter.ai/models?max_price=0):
      # - key: AI_PROVIDER
      #   value: openrouter
      # - key: OPENROUTER_API_KEY
      #   sync: false
      # - key: OPENROUTER_MODEL
      #   value: meta-llama/llama-3.1-8b-instruct:free # Beispiel, austauschbar
      #
      # Direkter DeepSeek-Zugang:
      # - key: DEEPSEEK_API_KEY
      #   sync: false
      # - key: DEEPSEEK_MODEL
      #   value: deepseek-v4-flash
      #
      # Krea für Bilder (API-Guthaben separat aktivieren):
      # - key: KREA_API_KEY
      #   sync: false
      # - key: KREA_IMAGES
      #   value: "1"
      # - key: KREA_IMAGE_MODEL
      #   value: image/krea/krea-2/medium
      #
      # Alternativ über OpenAI:
      # - key: AI_PROVIDER
      #   value: openai
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: OPENAI_MODEL
      #   value: gpt-4o-mini # optional; z. B. gpt-4o für mehr Qualität
      #
      # Alternativ über Anthropic/Claude:
      # - key: AI_PROVIDER
      #   value: anthropic
      # - key: ANTHROPIC_API_KEY
      #   sync: false
